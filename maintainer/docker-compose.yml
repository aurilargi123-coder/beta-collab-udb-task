version: '3.9'

services:
  # =====================================
  # MYSQL + PHPMYADMIN
  # =====================================
  mysql:
    image: mysql:8.0
    container_name: mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: devdb
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
    ports:
      - "3307:3306"   # diubah agar tidak bentrok dengan MySQL lokal
    networks:
      dev_mysql_net:
        ipv4_address: 172.0.5.10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-dev
    environment:
      PMA_HOST: mysql-dev     # diperbaiki (host harus nama container)
      PMA_PORT: 3306
    ports:
      - "8080:80"
    networks:
      dev_mysql_net:
        ipv4_address: 172.0.5.11

  # =====================================
  # POSTGRES + ADMINER
  # =====================================
  postgres:
    image: postgres:15
    container_name: postgres_server
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"    # diubah supaya tidak bentrok dengan Postgres lokal
    networks:
      postgres_net:
        ipv4_address: 172.0.6.10

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8082:8080"
    networks:
      postgres_net:
        ipv4_address: 172.0.6.11

# =====================================
# NETWORKS
# =====================================
networks:
  dev_mysql_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.0.5.0/24

  postgres_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.0.6.0/24
